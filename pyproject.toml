[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rush-arena"
version = "0.1.0"
description = "A 2D team shooter for 500 v 500 battles with control points, and the soldier network that plays it"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "safetensors>=0.4", "huggingface_hub>=0.23", "pygame>=2.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
rush-battle = "rush.cli:battle"
rush-view = "rush.cli:view"
rush-selfplay = "rush.cli:selfplay"
rush-gate = "rush.cli:gate"

[tool.setuptools.packages.find]
include = ["rush*"]

[tool.setuptools.package-data]
rush = ["viewer/**/*", "soldier_config.json"]
