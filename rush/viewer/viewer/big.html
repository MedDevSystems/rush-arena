<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Большая битва</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Exo 2 has Cyrillic; Orbitron/Rajdhani do not, so Russian text fell back to a system serif. -->
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#03050c; --text:#e8ecff; --dim:#7d86b0; --panel:rgba(5,7,16,.74); --edge:rgba(138,123,255,.35); --t0:#35c8ff; --t1:#ff8433; --hot:#d6d0ff;
          --display:'Exo 2', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; font-family:'Exo 2', system-ui, sans-serif; }
  canvas#view { position:fixed; inset:0; display:block; touch-action:none; cursor:grab; }
  .panel { background:var(--panel); border:1px solid var(--edge); border-radius:10px; backdrop-filter: blur(4px); }
  #hud { position:fixed; top:10px; left:50%; transform:translateX(-50%); width:min(980px, calc(100vw - 20px)); display:grid;
         grid-template-columns: 1fr auto 1fr; gap:10px; align-items:stretch; pointer-events:none; }
  .army { padding:8px 12px; display:flex; flex-direction:column; gap:2px; min-width:0; }
  .army.a1 { text-align:right; }
  .army .top { display:flex; align-items:baseline; gap:8px; }
  .army.a1 .top { flex-direction:row-reverse; }
  .army .name { font-family:var(--display); font-weight:900; letter-spacing:.08em; font-size:15px; }
  .army.a0 .name, .army.a0 .score { color:var(--t0); text-shadow:0 0 12px var(--t0); }
  .army.a1 .name, .army.a1 .score { color:var(--t1); text-shadow:0 0 12px var(--t1); }
  .army .label { color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .army .score { font-family:var(--display); font-weight:800; font-size:30px; line-height:1; margin-left:auto; font-variant-numeric:tabular-nums; }
  .army.a1 .score { margin-left:0; margin-right:auto; }
  .army .stats { display:flex; gap:12px; font-size:13px; color:var(--dim); flex-wrap:wrap; }
  .army.a1 .stats { justify-content:flex-end; }
  .army .stats b { color:var(--text); font-weight:600; }
  #center { padding:8px 14px; text-align:center; min-width:150px; }
  #clock { font-family:var(--display); font-weight:800; font-size:22px; letter-spacing:.06em; font-variant-numeric:tabular-nums; }
  .race { display:flex; gap:4px; margin-top:6px; height:6px; }
  .race > div { flex:1; background:rgba(255,255,255,.07); border-radius:3px; overflow:hidden; display:flex; }
  .race .r0 { justify-content:flex-end; }
  .race i { display:block; height:100%; width:0; }
  #race0 { background:var(--t0); box-shadow:0 0 8px var(--t0); }
  #race1 { background:var(--t1); box-shadow:0 0 8px var(--t1); }
  #where { margin-top:4px; color:var(--dim); font-size:12px; white-space:nowrap; }
  #feed { position:fixed; right:12px; top:112px; width:min(340px, 46vw); display:flex; flex-direction:column; gap:4px; pointer-events:none; }
  #feed .row { background:var(--panel); border:1px solid var(--edge); border-radius:8px; padding:4px 10px; font-size:14px; font-weight:600; }
  #feed .tag { font-family:var(--display); font-weight:800; font-size:11px; letter-spacing:.08em; padding:1px 6px; border-radius:4px; border:1px solid currentColor; color:var(--hot); }
  #feed .tag.hot { color:#ffd84a; } #feed .tag.clash { color:#fff; }
  #minimap { position:fixed; left:12px; bottom:76px; border:1px solid var(--edge); border-radius:6px; cursor:crosshair; }
  #controls { position:fixed; left:0; right:0; bottom:0; height:64px; display:flex; align-items:center; gap:10px; padding:0 12px;
              background:linear-gradient(transparent, rgba(3,5,12,.92) 35%); }
  button { background:var(--panel); color:var(--text); border:1px solid var(--edge); border-radius:6px; font:600 13px 'Exo 2', sans-serif;
           padding:5px 9px; cursor:pointer; }
  button.on { border-color:var(--hot); box-shadow:0 0 8px rgba(214,208,255,.5); }
  #play { width:40px; font-size:15px; }
  #timeline { flex:1; height:28px; min-width:60px; cursor:pointer; border-radius:4px; }
  #time { font-variant-numeric:tabular-nums; color:var(--dim); font-size:13px; white-space:nowrap; }
  #speed, #cam { display:flex; gap:3px; }
  #lod { font:700 11px var(--display); letter-spacing:.1em; color:var(--dim); width:56px; text-align:center; }
  #banner { position:fixed; left:50%; top:42%; transform:translate(-50%,-50%); text-align:center; display:none; pointer-events:none; }
  #banner.show { display:block; }
  #banner .big { font-family:var(--display); font-weight:900; font-size:clamp(28px, 7vw, 64px); letter-spacing:.08em; }
  #banner .small { color:var(--dim); font-size:16px; margin-top:6px; }
  .army .classes { display:none; gap:4px 9px; flex-wrap:wrap; font-size:12px; color:var(--dim); margin-top:4px; max-width:440px; }
  .army.a1 .classes { justify-content:flex-end; margin-left:auto; }
  .has-classes .army .classes { display:flex; }
  .army .classes .chip { display:inline-flex; align-items:center; gap:3px; white-space:nowrap; }
  .army .classes svg.cls { flex:none; }
  .army .classes b { color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  #classes .tw { overflow-x:auto; }
  #classes td.cl { white-space:nowrap; } #classes td.cl svg { vertical-align:middle; margin-right:1px; }
  #classes td.na { text-align:center; color:var(--dim); }
  #classes .sep { border-left:1px solid var(--edge); }        /* first column of the red army (column count varies) */
  #classes td, #classes th { white-space:nowrap; }
  #classbtn { display:none; } .has-classes #classbtn { display:inline-block; }
  #attnbtn { display:none; } .has-attn #attnbtn { display:inline-block; }
  #classes { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); width:min(1060px, calc(100vw - 24px)); max-height:calc(100vh - 200px);
             overflow:auto; padding:12px 16px; display:none; z-index:5; }
  #classes.show { display:block; }
  .ended #banner { top:22%; } .ended #classes { top:62%; max-height:calc(76vh - 160px); }
  #classes h2 { font-family:var(--display); font-weight:800; letter-spacing:.08em; font-size:15px; margin:0 0 8px; }
  #classes table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  #classes th { text-align:right; color:var(--dim); font-weight:600; padding:3px 6px; border-bottom:1px solid var(--edge); }
  #classes td { text-align:right; padding:3px 6px; border-bottom:1px solid rgba(255,255,255,.05); }
  #classes th:first-child, #classes td:first-child { text-align:left; }
  #classes .note { color:var(--dim); font-size:12px; margin-top:8px; }
  #stats { position:fixed; left:12px; top:112px; font:11px ui-monospace, monospace; color:var(--dim); max-width:46vw; display:none; }
  #stats.show { display:block; }
  #loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 40%, #0b1030, var(--bg)); }
  #loader.hidden { display:none; }
  #loader .box { width:min(520px, calc(100vw - 32px)); padding:24px; text-align:center; }
  #loader h1 { font-family:var(--display); font-weight:900; letter-spacing:.1em; font-size:22px; margin:0 0 6px; }
  #loader p { color:var(--dim); margin:0 0 16px; }
  #samples { display:flex; flex-direction:column; gap:6px; margin-top:12px; }
  .bar { height:4px; background:rgba(255,255,255,.08); border-radius:2px; margin-top:14px; overflow:hidden; }
  #prog { height:100%; width:0; background:var(--hot); }
  #err { color:#ff8a8a; margin-top:10px; min-height:1em; }
  @media (max-width: 560px) {
    #hud { top:6px; gap:6px; }
    .army { padding:6px 8px; } .army .name { font-size:12px; } .army .score { font-size:22px; }
    .army .label { display:none; } .army .stats { gap:6px; font-size:11px; }
    #center { min-width:84px; padding:6px 8px; } #clock { font-size:16px; } #where { display:none; }
    #feed { top:auto; bottom:190px; right:8px; width:62vw; } #feed .row { font-size:12px; padding:3px 7px; }
    #controls { height:auto; flex-wrap:wrap; padding:6px 8px 10px; gap:6px; }
    #timeline { order:-1; flex-basis:100%; height:22px; }
    #speed button:nth-child(1), #speed button:nth-child(6) { display:none; }
    #minimap { bottom:92px; left:8px; }
    #lod { display:none; }
    .army .classes { gap:2px 5px; font-size:10px; } .army .classes .t { display:none; } .army .classes svg.cls { width:12px; height:12px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">
  <div class="army a0 panel" id="army0">
    <div class="top"><span class="name">СИНИЕ</span><span class="label"></span><span class="score">0</span></div>
    <div class="stats"><span>живых <b class="alive">0</b></span><span>точек <b class="cps">0</b></span><span>жизней <b class="lives">0</b></span></div>
    <div class="classes"></div>
  </div>
  <div id="center" class="panel">
    <div id="clock">0:00</div>
    <div class="race"><div class="r0"><i id="race0"></i></div><div class="r1"><i id="race1"></i></div></div>
    <div id="where"></div>
  </div>
  <div class="army a1 panel" id="army1">
    <div class="top"><span class="name">КРАСНЫЕ</span><span class="label"></span><span class="score">0</span></div>
    <div class="stats"><span>живых <b class="alive">0</b></span><span>точек <b class="cps">0</b></span><span>жизней <b class="lives">0</b></span></div>
    <div class="classes"></div>
  </div>
</div>
<div id="feed"></div>
<div id="classes" class="panel"></div>
<div id="stats" class="panel"></div>
<canvas id="minimap"></canvas>
<div id="banner"><div class="big"></div><div class="small"></div></div>
<div id="controls">
  <button id="play" title="Пробел">▶</button>
  <canvas id="timeline"></canvas>
  <span id="time">0:00 / 0:00</span>
  <div id="speed"></div>
  <div id="cam"><button data-cam="overview" title="O">Вся карта</button><button data-cam="auto" title="A">Режиссёр</button><button data-cam="free" title="F">Свободно</button></div>
  <button id="classbtn" title="C">Классы</button>
  <button id="attnbtn" title="L — на кого смотрит боец (средний и ближний план)">Внимание</button>
  <span id="lod"></span>
</div>
<div id="loader">
  <div class="box panel">
    <h1>БОЛЬШАЯ БИТВА</h1>
    <p>Откройте повтор (<code>.arena.bin.gz</code>) или перетащите его в окно.</p>
    <button id="pick">Открыть повтор…</button>
    <input type="file" id="file" accept=".gz,.bin" hidden>
    <div id="samples"></div>
    <div class="bar"><div id="prog"></div></div>
    <div id="err"></div>
  </div>
</div>
<script>document.write('<script src="' + (new URLSearchParams(location.search).get("theme") || "../design/theme.js").replace(/"/g, "") + '"><\/script>');</script>
<script src="big/replay2.js"></script>
<script src="big/render_big.js"></script>
<script src="big/director_big.js"></script>
<script src="big/app_big.js"></script>
</body>
</html>
